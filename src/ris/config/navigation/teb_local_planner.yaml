TebLocalPlannerROS:
  odom_topic: odom

  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  max_samples: 200
  global_plan_overwrite_orientation: false
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 2.0
  global_plan_viapoint_sep: -1
  global_plan_prune_distance: 1.0
  exact_arc_length: false
  feasibility_check_no_poses: 2
  publish_feedback: false

  max_vel_x: 0.40
  max_vel_x_backwards: 0.10
  max_vel_y: 0.0
  max_vel_theta: 0.30

  acc_lim_x: 0.5
  acc_lim_theta: 1.2

  min_turning_radius: 0.50
  wheelbase: 0.24
  cmd_angle_instead_rotvel: true

  footprint_model:
    type: "line"
    line_start: [0.0, 0.0]
    line_end: [0.20, 0.0]

  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.35
  free_goal_vel: false
  complete_global_plan: true

  min_obstacle_dist: 0.16
  inflation_dist: 0.22
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 0.8
  obstacle_poses_affected: 15

  include_dynamic_obstacles: false
  dynamic_obstacle_inflation_dist: 0.5

  costmap_converter_plugin: ""
  costmap_converter_spin_thread: true
  costmap_converter_rate: 5

  no_inner_iterations: 4
  no_outer_iterations: 3
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.1
  obstacle_cost_exponent: 4

  weight_max_vel_x: 2.0
  weight_max_vel_theta: 1.0
  weight_acc_lim_x: 1.0
  weight_acc_lim_theta: 1.0
  weight_kinematics_nh: 1000.0
  weight_kinematics_forward_drive: 10.0
  weight_kinematics_turning_radius: 8.0
  weight_optimaltime: 1.0
  weight_shortest_path: 0.0
  weight_obstacle: 70.0
  weight_inflation: 0.2
  weight_viapoint: 1.0
  weight_adapt_factor: 2.0

  enable_homotopy_class_planning: false
  enable_multithreading: false

  shrink_horizon_backup: true
  shrink_horizon_min_duration: 5.0
  oscillation_recovery: true
  oscillation_v_eps: 0.05
  oscillation_omega_eps: 0.05
  oscillation_recovery_min_duration: 5.0
  oscillation_filter_duration: 5.0