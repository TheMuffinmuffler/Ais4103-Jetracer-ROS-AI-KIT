# Configuration origin / reuse declaration:
# This file is based on the JetRacer ROS navigation configuration from the
# project repository. I reused the original structure because it already matched
# the JetRacer ROS navigation stack, then modified selected parameters to fit my
# own SLAM/navigation project, map setup, robot behaviour, safety limits, and
# planner choices.
#
# ChatGPT was used as programming/configuration assistance for understanding the
# role of the parameters, comparing alternatives, and cleaning the YAML structure.
# The final parameter choices, integration, testing, and validation were done by
# me on the JetRacer setup.
#
# File-specific changes:
# - Kept the global costmap in the map frame for map-based navigation.
# - Increased transform_tolerance to improve robustness with TF delays.
# - Replaced the original VoxelLayer setup with ObstacleLayer for the 2D LaserScan
#   navigation setup.
# - Enabled static_layer updates from /map so the global planner can use the
#   saved/updated occupancy map.




global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  update_frequency: 1.0
  publish_frequency: 0.5
  transform_tolerance: 2.0

  plugins:
    - {name: static_layer,   type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer,type: "costmap_2d::InflationLayer"}

  static_layer:
    map_topic: /map
    subscribe_to_updates: true

